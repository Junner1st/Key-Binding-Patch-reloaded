# Environment Properties
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.22)
neo_version=21.1.244
loader_version_range=[1,)

# Mod Properties
mod_id=key_binding_patch
mod_name=Key Binding Patch
mod_license=All Rights Reserved
mod_version=1.21.1-1.0.2.0
mod_group_id=com.kbp
mod_authors=Sparrow_prime
mod_description=Patches the vanilla key binding system to support better key combinations (combo keys), shadow key bindings (multiple key sets for one function) and conflict resolution. In-game add/remove shadow key bindings from the controls screen.
